name: CoomiDev APK Build

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Ref to build (branch or tag). Defaults to the dispatch ref.'
        required: false
        type: string
      upload_apk:
        description: 'Upload the CoomiDev APK artifact.'
        required: true
        default: true
        type: boolean
      release_tag:
        description: 'Optional release tag. Leave empty to skip publication.'
        required: false
        type: string

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build CoomiDev APK
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      COOMI_DEV_BUILD: "1"
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4096M"
    steps:
      - name: Checkout source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.ref || github.ref_name }}
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Rust 1.95.0
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: aarch64-linux-android
          components: clippy,rustfmt

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK 27.0.12077973
        run: |
          sdkmanager --install "ndk;27.0.12077973" "platforms;android-36" "build-tools;36.0.0"
          echo "ANDROID_HOME=${ANDROID_HOME}" >> "$GITHUB_ENV"

      - name: Configure signing material
        # The app build reads keystore passwords from local.properties, which is gitignored.
        # All values come from encrypted secrets; never print, commit, or log them.
        env:
          STORE_PASSWORD: ${{ secrets.COOMI_SIGNING_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.COOMI_SIGNING_KEY_PASSWORD }}
        run: |
          if [ -z "${STORE_PASSWORD:-}" ] || [ -z "${KEY_PASSWORD:-}" ]; then
            echo "::error::Missing signing secrets COOMI_SIGNING_STORE_PASSWORD / COOMI_SIGNING_KEY_PASSWORD"
            exit 1
          fi
          printf 'coomi.signing.storePassword=%s\ncoomi.signing.keyPassword=%s\n' \
            "$STORE_PASSWORD" "$KEY_PASSWORD" > local.properties
          chmod 600 local.properties
          echo "local.properties:"
          sed -E 's/password=.*/password=<redacted>/' local.properties

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: ~/.cargo
          key: cargo-${{ runner.os }}-${{ hashFiles('apps/coomi-rs/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('apps/web/package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-

      - name: Install npm dependencies
        working-directory: apps/web
        run: |
          npm config set fetch-retries 5
          npm config set fetch-retry-maxtimeout 120000
          npm config set fetch-timeout 600000
          npm ci --no-audit --no-fund --loglevel=info

      - name: Type-check and build web frontend
        working-directory: apps/web
        run: npm run build

      - name: Rust format check (dev gate)
        working-directory: apps/coomi-rs
        run: |
          rustup component add rustfmt
          cargo fmt --all -- --check || echo "::warning::cargo fmt check reported diffs"

      - name: Build CoomiDev APK
        working-directory: .
        run: |
          ./gradlew --no-daemon --max-workers=2 \
            :app:clean :app:assembleRelease

      - name: Verify APK package identity and ABI
        run: |
          APK=$(find apps/coomi-app/app/build/outputs/apk -type f -name 'CoomiDev-*.apk' | sort | tail -n 1)
          if [ -z "$APK" ]; then
            echo "::error::No CoomiDev APK produced"
            exit 1
          fi
          echo "APK=$APK" >> "$GITHUB_ENV"
          echo "APK_PATH=$APK"
          ls -lh "$APK"
          # Package must be com.coomidev.android
          "$ANDROID_HOME/build-tools/36.0.0/aapt2" dump badging "$APK" | grep -E "package: name='com.coomidev.android'"
          # ABI must include arm64-v8a
          "$ANDROID_HOME/build-tools/36.0.0/aapt2" dump badging "$APK" | grep -E "native-code|arm64-v8a"

      - name: Verify APK signature
        run: |
          APK="${{ env.APK }}"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"
          # Verify signing certificate name if we want to assert the debug key identity.

      - name: Upload CoomiDev APK artifact
        if: ${{ inputs.upload_apk == true }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: coomidev-apk
          path: "${{ env.APK }}"
          if-no-files-found: error

  release:
    name: Publish CoomiDev release (optional)
    runs-on: ubuntu-24.04
    needs: build
    if: ${{ inputs.release_tag != '' && github.event_name == 'workflow_dispatch' }}
    permissions:
      contents: write
    timeout-minutes: 30
    steps:
      - name: Download CoomiDev APK
        uses: actions/download-artifact@v4
        with:
          name: coomidev-apk
          path: release-assets

      - name: Create GitHub Release in fork
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag }}
        run: |
          APK=$(find release-assets -type f -name '*.apk' | sort | tail -n 1)
          if [ -z "$APK" ]; then
            echo "::error::No APK to release"
            exit 1
          fi
          gh release create "$TAG" "$APK" \
            --title "CoomiDev $TAG" \
            --notes "CoomiDev preview build for $TAG. Package: com.coomidev.android. App: CoomiDev. Port: 18765." \
            || echo "::warning::Release may already exist or failed; continuing"
