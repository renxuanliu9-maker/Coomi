plugins {
    id 'com.android.application'
}

android {
    namespace 'com.local.mcpserver'
    compileSdk 34

    defaultConfig {
        applicationId 'com.local.mcpserver'
        minSdk 26
        // targetSdk 33 (not 34): on targetSdk < 34 Android does NOT require a
        // foreground-service type, so startForeground(id, notif) works without
        // the dataSync/specialUse type permission that would otherwise throw a
        // SecurityException and crash the service on Android 14+.
        targetSdk 33
        versionCode 2
        versionName '1.0.1'
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
        debug {
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // No AndroidX / Kotlin dependencies on purpose: they pull in kotlin-stdlib
    // duplicate-class conflicts. The UI uses android.app.Activity directly.
}
