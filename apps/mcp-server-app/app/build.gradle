plugins {
    id 'com.android.application'
}

android {
    namespace 'com.local.mcpserver'
    compileSdk 34

    defaultConfig {
        applicationId 'com.local.mcpserver'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
        debug {
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // No AndroidX / Kotlin dependencies on purpose: they pull in kotlin-stdlib
    // duplicate-class conflicts. The UI uses android.app.Activity directly.
}
